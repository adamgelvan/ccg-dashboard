/* ---------- date helpers ---------- */
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function addDays(s, n) {
  const d = new Date(s + "T00:00:00Z");
  if (isNaN(d)) return null;
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

function isoWeekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  if (isNaN(d)) return null;
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
}

function weekRange(key) {
  const parts = String(key || "").split("-W");
  const y = Number(parts[0]), w = Number(parts[1]);
  if (!y || !w || isNaN(y) || isNaN(w)) return null;
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const day = jan4.getUTCDay() || 7;
  const mon = new Date(jan4);
  mon.setUTCDate(jan4.getUTCDate() - day + 1 + (w - 1) * 7);
  const sun = new Date(mon);
  sun.setUTCDate(mon.getUTCDate() + 6);
  return { start: mon.toISOString().slice(0, 10), end: sun.toISOString().slice(0, 10) };
}

function weekBounds(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  const dow = d.getUTCDay() || 7;
  const start = addDays(dateStr, -(dow - 1));
  return { start, end: addDays(start, 6) };
}

function periodKeyOf(dateStr, g) {
  if (!dateStr) return null;
  if (g === "day") return dateStr;
  if (g === "week") return isoWeekKey(dateStr);
  if (g === "month") return dateStr.slice(0, 7);
  return "all";
}

function prevPeriodKey(g, key) {
  if (!key) return null;
  if (g === "day") return addDays(key, -1);
  if (g === "week") {
    const r = weekRange(key);
    return r ? isoWeekKey(addDays(r.start, -7)) : null;
  }
  if (g === "month") {
    let [y, m] = key.split("-").map(Number);
    if (!y || !m || isNaN(y) || isNaN(m)) return null;
    m -= 1;
    if (m === 0) { m = 12; y -= 1; }
    return `${y}-${String(m).padStart(2, "0")}`;
  }
  return null;
}

function fmtDate(s) {
  if (!s) return "";
  const d = new Date(s + "T00:00:00Z");
  if (isNaN(d)) return String(s);
  return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`;
}

function periodLabel(g, key) {
  if (!key) return "";
  if (g === "day") return fmtDate(key);
  if (g === "week") {
    const r = weekRange(key);
    if (!r) return String(key);
    return `W${key.split("-W")[1]} · ${fmtDate(r.start)}–${fmtDate(r.end)}`;
  }
  if (g === "month") {
    const [y, m] = key.split("-");
    return `${MONTHS[Number(m) - 1] || "?"} ${y}`;
  }
  return "All time";
}

function periodChipLabel(g, key) {
  if (g === "day") return fmtDate(key);
  if (g === "week") return `W${key.split("-W")[1]}`;
  if (g === "month") {
    const [y, m] = key.split("-");
    return `${MONTHS[Number(m) - 1]} ${String(y).slice(2)}`;
  }
  return key;
}

/* ---------- money helpers ---------- */
function moneyVal(v) {
  const n = parseFloat(String(v ?? "").replace(/[$,\s]/g, ""));

}

/* Total Commission may be a text breakdown ending in "= $1808.72" —
   take the trailing total if present, else parse as plain money. */
function commissionVal(v) {
  const s = String(v ?? "");
  const m = s.match(/=\s*\$?\s*([\d,]+(?:\.\d+)?)\s*$/);
  if (m) return parseFloat(m[1].replace(/,/g, "")) || 0;
  return moneyVal(s);
}

/* ---------- fuzzy name matching ---------- */
function normName(s) {
  return String(s || "").toLowerCase().replace(/[^a-z\s]/g, " ").replace(/\s+/g, " ").trim();
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(
        prev[j] + 1,
        cur[j - 1] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
    prev = cur;
  }
  return prev[n];
}

function nameScore(a, b) {
  const na = normName(a), nb = normName(b);
  if (!na || !nb) return 0;
  if (na === nb) return 1;
  const levRatio = 1 - levenshtein(na, nb) / Math.max(na.length, nb.length);
  const ta = new Set(na.split(" ")), tb = new Set(nb.split(" "));
  const inter = [...ta].filter((t) => tb.has(t));
  const tokenScore = (2 * inter.length) / (ta.size + tb.size);
  let score = Math.max(levRatio, tokenScore);
  if (inter.some((t) => t.length >= 4)) score = Math.max(score, 0.85);
  return score;
}

const MATCH_THRESHOLD = 0.8;

function resolveAgents(names) {
  const sorted = [...names].sort((a, b) => b.length - a.length || a.localeCompare(b));
  const canon = [];
  const map = {};
  for (const name of sorted) {
    let best = null, bestScore = 0;
    for (const c of canon) {
      const s = nameScore(name, c);
      if (s > bestScore) { bestScore = s; best = c; }
    }
    if (best && bestScore >= MATCH_THRESHOLD) map[name] = best;
    else { canon.push(name); map[name] = name; }
  }
  return map;
}

/* ---------- parsers ---------- */
function parseCallReport(text) {
  const res = Papa.parse(text, { skipEmptyLines: true });
  const agents = {};
  let buffer = [];
  for (const row of res.data) {
    const first = String(row[0] ?? "").trim();
    const second = String(row[1] ?? "").trim();
    if (first.toLowerCase() === "queue") continue; // header
    if (first === "") {
      if (second) {
        if (!agents[second]) agents[second] = {};
        for (const q of buffer) {
          agents[second][q.queue] = (agents[second][q.queue] || 0) + q.calls;
        }
      }
      buffer = [];
    } else {
      const calls = parseInt(String(row[1] ?? "").replace(/[^\d-]/g, ""), 10);
      if (!isNaN(calls)) buffer.push({ queue: first, calls });
    }
  }
  return agents; // { agentName: { queue: calls } }
}

function parseSalesReport(text, fallbackDate) {
  const res = Papa.parse(text, { header: true, skipEmptyLines: true });
  const rows = [];
  for (const r of res.data) {
    const agent = String(r["Agent"] ?? "").trim();
    if (!agent) continue;
    const created = String(r["Created"] ?? "").slice(0, 10);
    rows.push({
      id: String(r["Contact Id"] ?? "").trim() || null,
      agent,
      campaign: String(r["LEAD/CAMPAIGN"] ?? "").trim(),
      premium: moneyVal(r["Total Monthly Premium"]),
      commission: commissionVal(r["Total Commission"]),
      date: /^\d{4}-\d{2}-\d{2}$/.test(created) ? created : fallbackDate,
    });
  }
  return rows;
}

async function sbFetch(baseUrl, path, opts = {}, anonKey, token) {
  const res = await fetch(String(baseUrl).replace(/\/+$/, "") + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      apikey: anonKey,
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(opts.headers || {}),
    },
  });
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch (e) { /* non-JSON */ }
  if (!res.ok) {
    throw new Error(
      (json && (json.message || json.error_description || json.msg)) || `HTTP ${res.status}`
    );
  }
  return json;
}

/* Union-merge used only on first sign-in (local + remote may both have data).
   After that, the cloud copy is the source of truth (last write wins). */
function mergeData(remote, local) {
  const slices = [...((remote && remote.slices) || [])];
  const ids = new Set(slices.map((s) => s.id));
  ((local && local.slices) || []).forEach((s) => { if (!ids.has(s.id)) slices.push(s); });
  return {
    slices,
    queueCost: { ...((remote && remote.queueCost) || {}), ...((local && local.queueCost) || {}) },
  };
}

/* ---------- animation helpers ---------- */
function Reveal({ children, delay = 0, style }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (typeof IntersectionObserver === "undefined") { el.classList.add("in"); return; }
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { el.classList.add("in"); obs.disconnect(); }
        });
      },
      { threshold: 0.08 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} className="reveal" style={{ transitionDelay: `${delay}ms`, ...style }}>
      {children}
    </div>
  );
}

function useCountUp(value, duration = 650) {
  const [display, setDisplay] = useState(value);
  const fromRef = useRef(0);
  useEffect(() => {
    if (!isFinite(value)) { setDisplay(value); return; }
    const from = isFinite(fromRef.current) ? fromRef.current : 0;
    const to = value;
    let raf;
    const t0 = (typeof performance !== "undefined" ? performance.now() : 0);
    const step = (t) => {
      const k = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1 - k, 3);
      setDisplay(from + (to - from) * eased);
      if (k < 1) raf = requestAnimationFrame(step);
      else fromRef.current = to;
    };
    if (typeof requestAnimationFrame === "undefined") { setDisplay(to); fromRef.current = to; return; }
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value, duration]);
  return display;
}

function Dot({ on, color, title }) {
  return (
    <span
      title={title}
      style={{
        display: "inline-block", width: 7, height: 7, borderRadius: "50%",

function TrendArrow({ curr, prev, noun }) {
  if (!isFinite(curr) || !isFinite(prev) || prev <= 0) {
    return <span style={{ color: C.hair }}>·</span>;
  }
  const pct = ((curr - prev) / prev) * 100;
  if (Math.abs(pct) < 0.05) {
    return <span title={`CPA flat vs prior ${noun}`} style={{ color: C.muted, fontSize: 12 }}>—</span>;
  }
  const improved = pct < 0; // lower CPA = better
  const Icon = improved ? TrendingUp : TrendingDown;
  const color = improved ? C.green : C.red;
  return (
    <span
      title={`CPA ${improved ? "improved" : "worsened"} ${Math.abs(pct).toFixed(1)}% vs prior ${noun} (${fmt2.format(prev)} → ${fmt2.format(curr)})`}
      style={{ display: "inline-flex", alignItems: "center", gap: 4, color, fontWeight: 700 }}
    >
      <Icon size={15} />
      <span style={{ fontSize: 12 }}>{Math.abs(pct).toFixed(0)}%</span>
    </span>
  );
}

/* ---------- main ---------- */
function CPALedger() {
  const [slices, setSlices] = useState([]);     // [{id, type, start, end, calls|sales}]
  const [queueCost, setQueueCost] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [upStart, setUpStart] = useState(todayISO());
  const [upEnd, setUpEnd] = useState(todayISO());
  const [view, setView] = useState("week");     // day | week | month | all
  const [period, setPeriod] = useState(null);   // active period key, or null
  const [pending, setPending] = useState(null); // { start, end, type, payload, replaceId }
  const [confirmClear, setConfirmClear] = useState(false);
  const [pendingRestore, setPendingRestore] = useState(null);
  const [showUploads, setShowUploads] = useState(false);
  const [toast, setToast] = useState(null);
  const callRef = useRef(null);
  const salesRef = useRef(null);
  const restoreRef = useRef(null);

  /* ----- cloud sync state ----- */
  const [cloudCfg, setCloudCfg] = useState({ url: "", anonKey: "" });
  const [session, setSession] = useState(null); // {access_token, refresh_token, exp, email}
  const [syncStatus, setSyncStatus] = useState("off"); // off|syncing|synced|error
  const [showCloud, setShowCloud] = useState(false);
  const [cloudForm, setCloudForm] = useState({ email: "", password: "" });
  const sessionRef = useRef(null);
  const cloudCfgRef = useRef({ url: "", anonKey: "" });
  const cloudReadyRef = useRef(false); // first sync (merge) completed
  const dirtyRef = useRef(false);      // local changes not yet pushed
  const lastSeenRef = useRef(null);    // remote updated_at we last adopted/pushed
  useEffect(() => { sessionRef.current = session; }, [session]);
  useEffect(() => { cloudCfgRef.current = cloudCfg; }, [cloudCfg]);

  /* ----- persistence (with v1 migration) ----- */
  useEffect(() => {
    (async () => {
      try {
        if (typeof window !== "undefined" && window.storage) {
          const unwrap = (res) => (res && typeof res === "object" && "value" in res ? res.value : res);
          const raw = unwrap(await window.storage.get(STORAGE_KEY));
          if (raw) {
            const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
            if (parsed && Array.isArray(parsed.slices)) {
              setSlices(parsed.slices);
              setQueueCost(parsed.queueCost || {});
            }
          } else {
            // migrate v1 (week-keyed) data if present
            const old = unwrap(await window.storage.get(LEGACY_KEY));
            if (old) {
              const v1 = typeof old === "string" ? JSON.parse(old) : old;
              if (v1 && v1.weeks) {
                const migrated = [];
                Object.entries(v1.weeks).forEach(([wk, obj]) => {
                  let r;
                  try { r = weekRange(wk); } catch { return; }
                  if (obj.calls) migrated.push({ id: uid(), type: "calls", start: r.start, end: r.end, calls: obj.calls });
                  if (obj.sales) migrated.push({
                    id: uid(), type: "sales", start: r.start, end: r.end,
                    sales: obj.sales.map((row) => ({ id: null, date: r.start, ...row })),
                  });
                });
                setSlices(migrated);
                setQueueCost(v1.queueCost || {});
              }
            }
          }
        }
      } catch (e) { /* storage unavailable — run in-memory */ }
      /* cloud config + session (survive reloads) */
      try {
        if (typeof window !== "undefined" && window.storage) {
          const unwrap = (res) => (res && typeof res === "object" && "value" in res ? res.value : res);
          const rawCfg = unwrap(await window.storage.get(CLOUD_CFG_KEY));
          let cfg = rawCfg ? (typeof rawCfg === "string" ? JSON.parse(rawCfg) : rawCfg) : null;
          if (!cfg && typeof window.CCG_CLOUD === "object" && window.CCG_CLOUD && window.CCG_CLOUD.url) {
            cfg = { url: window.CCG_CLOUD.url, anonKey: window.CCG_CLOUD.anonKey || "" };
          }
          if (cfg && cfg.url) setCloudCfg({ url: cfg.url, anonKey: cfg.anonKey || "" });
          const rawSes = unwrap(await window.storage.get(CLOUD_SES_KEY));
          const ses = rawSes ? (typeof rawSes === "string" ? JSON.parse(rawSes) : rawSes) : null;
          if (ses && ses.refresh_token) setSession(ses);
        }
      } catch (e) { /* ignore */ }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        if (typeof window !== "undefined" && window.storage) {
          await window.storage.set(STORAGE_KEY, JSON.stringify({ slices, queueCost }));
        }
      } catch (e) { /* ignore */ }
    })();
  }, [slices, queueCost, loaded]);

  /* ----- toast ----- */
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 4200);
    return () => clearTimeout(t);
  }, [toast]);

  /* ----- presets ----- */
  const applyPreset = (p) => {
    const t = todayISO();
    if (p === "today") { setUpStart(t); setUpEnd(t); }
    else if (p === "yesterday") { const y = addDays(t, -1); setUpStart(y); setUpEnd(y); }
    else if (p === "thisweek") { const w = weekBounds(t); setUpStart(w.start); setUpEnd(w.end); }
    else if (p === "lastweek") { const w = weekBounds(addDays(t, -7)); setUpStart(w.start); setUpEnd(w.end); }
    else if (p === "thismonth") {
      const first = t.slice(0, 8) + "01";
      const d = new Date(t + "T00:00:00Z");
      const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).toISOString().slice(0, 10);
      setUpStart(first); setUpEnd(last);
    }
  };

  /* ----- upload handling ----- */
  const commit = (start, end, type, payload, replaceId) => {
    setSlices((prev) => {
      const next = replaceId ? prev.filter((s) => s.id !== replaceId) : [...prev];
      next.push({ id: uid(), type, start, end, [type]: payload });
      return next;
    });
    const n = type === "calls" ? Object.keys(payload).length : payload.length;
    setToast(
      `${type === "calls" ? "Call report" : "Sales report"} loaded for ${fmtDate(start)}${start !== end ? `–${fmtDate(end)}` : ""} — ${n} ${type === "calls" ? "agents" : "policies"}`
    );
  };

  const handleFile = (type) => async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    let start = upStart, end = upEnd;
    if (!start || !end) { setToast("Pick a date range first."); return; }
    if (start > end) { const t = start; start = end; end = t; setUpStart(start); setUpEnd(end); }
    let text;
    try { text = await file.text(); } catch { setToast("Could not read that file."); return; }
    let payload;
    try {
      payload = type === "calls" ? parseCallReport(text) : parseSalesReport(text, start);
    } catch { setToast("That file did not parse as a CSV."); return; }
    const empty = type === "calls" ? Object.keys(payload).length === 0 : payload.length === 0;
    if (empty) { setToast(`No ${type === "calls" ? "agent call" : "sales"} rows found — check the file format.`); return; }

    const exact = slices.find((s) => s.type === type && s.start === start && s.end === end);
    if (exact) {
      setPending({ start, end, type, payload, replaceId: exact.id });
      return;
    }
    const overlap = slices.find((s) => s.type === type && s.start <= end && start <= s.end);
    commit(start, end, type, payload, null);
    if (overlap && type === "calls") {
      setToast(`Heads up: this call report overlaps ${fmtDate(overlap.start)}–${fmtDate(overlap.end)} — calls may be double-counted. Delete one in Uploads if so.`);
    }
  };

  const deleteSlice = (id) => setSlices((prev) => prev.filter((s) => s.id !== id));

  /* ----- backup / restore ----- */
  const exportBackup = () => {
    try {
      const blob = new Blob(
        [JSON.stringify({ v: 2, exported: todayISO(), slices, queueCost }, null, 2)],
        { type: "application/json" }
      );
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cpa-ledger-backup-${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setToast("Backup downloaded — it holds every upload and your queue rates.");
    } catch (e) { setToast("Could not create the backup."); }
  };

  const handleRestore = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (!parsed || !Array.isArray(parsed.slices)) {
        setToast("That file doesn't look like a ledger backup.");
        return;
      }
      if (slices.length === 0) {
        setSlices(parsed.slices);
        setQueueCost(parsed.queueCost || {});
        setToast(`Backup restored — ${parsed.slices.length} uploads back on the ledger.`);
      } else {
        setPendingRestore(parsed);
      }
    } catch (e) { setToast("Could not read that backup file."); }
  };

  /* ----- cloud sync engine ----- */
  const persistCloud = async (cfg, ses) => {
    try {
      if (window.storage) {
        if (cfg) await window.storage.set(CLOUD_CFG_KEY, JSON.stringify(cfg));
        if (ses === null) await window.storage.delete(CLOUD_SES_KEY);
        else if (ses) await window.storage.set(CLOUD_SES_KEY, JSON.stringify(ses));
      }
    } catch (e) { /* ignore */ }
  };

  const ensureToken = async () => {
    const ses = sessionRef.current;
    const cfg = cloudCfgRef.current;
    if (!ses) throw new Error("Not signed in");
    if (Date.now() < (ses.exp || 0) - 60000) return ses.access_token;
    const j = await sbFetch(cfg.url, "/auth/v1/token?grant_type=refresh_token",
      { method: "POST", body: JSON.stringify({ refresh_token: ses.refresh_token }) }, cfg.anonKey);
    const next = {
      access_token: j.access_token, refresh_token: j.refresh_token || ses.refresh_token,
      exp: Date.now() + (j.expires_in || 3600) * 1000, email: ses.email,
    };
    setSession(next);
    sessionRef.current = next;
    persistCloud(null, next);
    return next.access_token;
  };

  const fetchRemote = async (token) => {
    const cfg = cloudCfgRef.current;
    const rows = await sbFetch(cfg.url, "/rest/v1/ledger?id=eq.main&select=data,updated_at", {}, cfg.anonKey, token);
    return rows && rows[0] ? rows[0] : null;
  };

  const pushCloud = async (data, token) => {
    const cfg = cloudCfgRef.current;
    const now = new Date().toISOString();
    await sbFetch(cfg.url, "/rest/v1/ledger",
      { method: "POST", headers: { Prefer: "resolution=merge-duplicates" },
        body: JSON.stringify([{ id: "main", data, updated_at: now }]) },
      cfg.anonKey, token);
    lastSeenRef.current = now;
  };

  const initialSync = async (token, localSlices, localCost) => {
    const remote = await fetchRemote(token);
    if (remote && remote.data && Array.isArray(remote.data.slices)) {
      const merged = localSlices.length === 0
        ? { slices: remote.data.slices, queueCost: remote.data.queueCost || {} }
        : mergeData(remote.data, { slices: localSlices, queueCost: localCost });
      setSlices(merged.slices);
      setQueueCost(merged.queueCost);
      lastSeenRef.current = remote.updated_at;
      await pushCloud(merged, token);
    } else {
      await pushCloud({ slices: localSlices, queueCost: localCost }, token);
    }
    cloudReadyRef.current = true;
    dirtyRef.current = false;
    setSyncStatus("synced");
  };

  const signIn = async () => {
    const cfg = cloudCfg;
    if (!cfg.url || !cfg.anonKey || !cloudForm.email || !cloudForm.password) {
      setToast("Fill in all four fields to sign in."); return;
    }
    try {
      setSyncStatus("syncing");
      cloudCfgRef.current = cfg;
      const j = await sbFetch(cfg.url, "/auth/v1/token?grant_type=password",
        { method: "POST", body: JSON.stringify({ email: cloudForm.email.trim(), password: cloudForm.password }) },
        cfg.anonKey);
      const ses = {
        access_token: j.access_token, refresh_token: j.refresh_token,
        exp: Date.now() + (j.expires_in || 3600) * 1000,
        email: (j.user && j.user.email) || cloudForm.email.trim(),
      };
      setSession(ses);
      sessionRef.current = ses;
      persistCloud({ url: cfg.url.trim(), anonKey: cfg.anonKey.trim() }, ses);
      await initialSync(ses.access_token, slices, queueCost);
      setShowCloud(false);
      setCloudForm((f) => ({ ...f, password: "" }));
      setToast(`Signed in as ${ses.email} — ledger is syncing.`);
    } catch (e) {
      setSyncStatus("error");
      setToast(`Sign-in failed: ${e.message}`);
    }
  };

  const signOut = () => {
    setSession(null);
    sessionRef.current = null;
    cloudReadyRef.current = false;
    setSyncStatus("off");
    persistCloud(null, null);
    setToast("Signed out — data stays on this computer only.");
  };

  const syncNow = async () => {
    if (!sessionRef.current) return;
    try {
      setSyncStatus("syncing");
      const tok = await ensureToken();
      if (!cloudReadyRef.current) {
        await initialSync(tok, slices, queueCost);
      } else {
        const remote = await fetchRemote(tok);
        if (remote && remote.updated_at !== lastSeenRef.current && remote.data && !dirtyRef.current) {
          lastSeenRef.current = remote.updated_at;
          setSlices(remote.data.slices || []);
          setQueueCost(remote.data.queueCost || {});
        } else {
          await pushCloud({ slices, queueCost }, tok);
          dirtyRef.current = false;
        }
        setSyncStatus("synced");
      }
      setToast("Ledger synced.");
    } catch (e) {
      setSyncStatus("error");
      setToast(`Sync failed: ${e.message}`);
    }
  };

  /* resume session on reload: run first sync once storage has loaded */
  useEffect(() => {
    if (!loaded || !session || cloudReadyRef.current) return;
    (async () => {
      try {
        setSyncStatus("syncing");
        const tok = await ensureToken();
        await initialSync(tok, slices, queueCost);
      } catch (e) { setSyncStatus("error"); }
    })();
  }, [loaded, session]); // eslint-disable-line

  /* push local changes (debounced, last write wins) */
  useEffect(() => {
    if (!loaded || !session || !cloudReadyRef.current) return;
    dirtyRef.current = true;
    setSyncStatus("syncing");
    const t = setTimeout(async () => {
      try {
        const tok = await ensureToken();
        await pushCloud({ slices, queueCost }, tok);
        dirtyRef.current = false;
        setSyncStatus("synced");
      } catch (e) { setSyncStatus("error"); }
    }, 1200);
    return () => clearTimeout(t);
  }, [slices, queueCost, loaded, session]); // eslint-disable-line

  /* pull partner's changes every 60s */
  useEffect(() => {
    if (!session) return;
    const iv = setInterval(async () => {
      if (dirtyRef.current || !cloudReadyRef.current) return;
      try {
        const tok = await ensureToken();
        const remote = await fetchRemote(tok);
        if (remote && remote.updated_at && remote.updated_at !== lastSeenRef.current && remote.data) {
          lastSeenRef.current = remote.updated_at;
          setSlices(remote.data.slices || []);
          setQueueCost(remote.data.queueCost || {});
        }
      } catch (e) { /* transient network errors are fine */ }
    }, 60000);
    return () => clearInterval(iv);
  }, [session]); // eslint-disable-line

  const clearAll = () => {
    setSlices([]);
    setQueueCost({});
    setConfirmClear(false);
    try {
      if (window.storage) { window.storage.delete(STORAGE_KEY); window.storage.delete(LEGACY_KEY); }
    } catch (e) { /* ignore */ }
  };

  /* ----- queues (global; rates apply everywhere) ----- */
  const allQueues = useMemo(() => {
    const s = new Set();
    slices.forEach((sl) => {
      if (sl.type === "calls") Object.values(sl.calls || {}).forEach((qs) => Object.keys(qs).forEach((q) => s.add(q)));
    });
    return [...s].sort();
  }, [slices]);

  const unpriced = allQueues.filter((q) => !(parseFloat(queueCost[q]) > 0));

  /* ----- global identity map (stable across periods) ----- */
  const globalMap = useMemo(() => {
    const names = new Set();
    slices.forEach((sl) => {
      if (sl.type === "calls") Object.keys(sl.calls || {}).forEach((n) => names.add(n));
      else (sl.sales || []).forEach((r) => names.add(r.agent));
    });
    return resolveAgents(names);
  }, [slices]);

  /* ----- aggregation for a granularity + period ----- */
  const aggregateFor = (g, key) => {
    const agents = {};
    const get = (raw) => {
      const c = globalMap[raw] || raw;
      if (!agents[c]) {
        agents[c] = { name: c, queues: {}, calls: 0, policies: 0, outbound: 0, premium: 0, commission: 0 };
      }
      return agents[c];
    };
    const inScope = (dateStr) => g === "all" || periodKeyOf(dateStr, g) === key;
    const seenIds = new Set();
    let multiDayCalls = false;

    slices.forEach((sl) => {
      if (sl.type === "calls") {
        if (!inScope(sl.start)) return;
        if (g === "day" && sl.start !== sl.end) multiDayCalls = true;
        Object.entries(sl.calls || {}).forEach(([n, qs]) => {
          const a = get(n);
          Object.entries(qs).forEach(([q, c]) => {
            a.queues[q] = (a.queues[q] || 0) + c;
            a.calls += c;
          });
        });
      } else {
        (sl.sales || []).forEach((r) => {
          if (!inScope(r.date || sl.start)) return;
          if (r.id) {
            if (seenIds.has(r.id)) return; // same policy uploaded twice — count once
            seenIds.add(r.id);
          }
          const a = get(r.agent);
          if (isOutbound(r.campaign)) a.outbound += 1;
          else {
            a.policies += 1;
            a.premium += r.premium;
            a.commission += r.commission;
          }
        });
      }
    });

    let totalSpend = 0, totalPolicies = 0, totalCalls = 0, totalCommission = 0;
    const list = Object.values(agents).map((a) => {
      let spend = 0;
      Object.entries(a.queues).forEach(([q, c]) => { spend += c * (parseFloat(queueCost[q]) || 0); });
      totalSpend += spend;
      totalPolicies += a.policies;
      totalCalls += a.calls;
      totalCommission += a.commission;
      const roi = spend > 0 ? ((a.commission - spend) / spend) * 100 : null;
      return { ...a, spend, roi, cpa: a.policies > 0 ? spend / a.policies : Infinity };
    });

    const blended = totalPolicies > 0 ? totalSpend / totalPolicies : NaN;
    const blendedRoi = totalSpend > 0 ? ((totalCommission - totalSpend) / totalSpend) * 100 : null;

    list.sort((a, b) => {
      const fa = isFinite(a.cpa), fb = isFinite(b.cpa);
      if (fa && fb) return a.cpa - b.cpa;
      if (fa) return -1;
      if (fb) return 1;
      return b.spend - a.spend;
    });

    return { list, totalSpend, totalPolicies, totalCalls, totalCommission, blended, blendedRoi, multiDayCalls };
  };

  /* ----- available periods for the current view ----- */
  const periods = useMemo(() => {
    if (view === "all") return [];
    const m = {}; // key -> {calls, sales}
    slices.forEach((sl) => {
      if (sl.type === "calls") {
        const k = periodKeyOf(sl.start, view);
        (m[k] = m[k] || {}).calls = true;
      } else {
        (sl.sales || []).forEach((r) => {
          const k = periodKeyOf(r.date || sl.start, view);
          (m[k] = m[k] || {}).sales = true;
        });
      }
    });
    return Object.keys(m).sort().map((k) => ({ key: k, ...m[k] }));
  }, [slices, view]);

  /* Always-valid period derived at render time — `period` state may briefly
     hold a key from another granularity right after a tab switch, which must
     never reach the date helpers or the aggregation. */
  const activePeriod = useMemo(() => {
    if (view === "all") return null;
    if (period && periods.some((p) => p.key === period)) return period;
    return periods.length ? periods[periods.length - 1].key : null;
  }, [view, period, periods]);

  useEffect(() => {
    if (view === "all") return;
    if (period !== activePeriod) setPeriod(activePeriod);
  }, [view, period, activePeriod]);

  /* Switching tabs converts the current period to the new granularity
     (e.g. day Jun 2 → week W23 → month Jun) instead of carrying a stale key. */
  const switchView = (v) => {
    if (v !== "all" && view !== "all" && activePeriod) {
      let rep = null; // representative date inside the current period
      if (view === "day") rep = activePeriod;
      else if (view === "week") { const r = weekRange(activePeriod); rep = r && r.start; }
      else if (view === "month") rep = activePeriod + "-01";
      setPeriod(rep ? periodKeyOf(rep, v) : null);
    }
    setView(v);
  };

  const effView = view === "all" ? "all" : view;
  const effKey = view === "all" ? null : activePeriod;

  const agg = useMemo(
    () => aggregateFor(effView, effKey),
    [slices, queueCost, effView, effKey, globalMap] // eslint-disable-line
  );
  const prevKey = view !== "all" && activePeriod ? prevPeriodKey(view, activePeriod) : null;
  const prevAgg = useMemo(
    () => (prevKey ? aggregateFor(view, prevKey) : null),
    [slices, queueCost, view, prevKey, globalMap] // eslint-disable-line
  );
  const prevByName = useMemo(() => {
    const m = {};
    if (prevAgg) prevAgg.list.forEach((a) => { m[a.name] = a; });
    return m;
  }, [prevAgg]);

  const { list, totalSpend, totalPolicies, totalCalls, blended, blendedRoi, multiDayCalls } = agg;
  const hasData = slices.length > 0;
  const noun = GRAN_NOUN[view] || "period";

  /* hero count-up + delta vs previous period */
  const heroCpa = useCountUp(isFinite(blended) ? blended : NaN);
  const heroDelta = (() => {
    if (!prevAgg || !isFinite(blended) || !isFinite(prevAgg.blended) || prevAgg.blended <= 0) return null;
    const pct = ((blended - prevAgg.blended) / prevAgg.blended) * 100;
    if (Math.abs(pct) < 0.05) return { text: `flat vs prior ${noun}`, color: "rgba(247,245,239,0.55)" };
    const improved = pct < 0;
    return {
      text: `${improved ? "▼" : "▲"} ${Math.abs(pct).toFixed(1)}% vs prior ${noun}`,
      color: improved ? "#5BBE8E" : "#E08A7B",
    };
  })();

  const shortName = (n) => {
    const t = n.split(/\s+/).filter(Boolean);
    return t.length > 1 ? `${t[0]} ${t[t.length - 1][0]}.` : n;
  };

  const cpaData = list
    .filter((a) => a.policies > 0)
    .map((a) => ({
      name: shortName(a.name),
      full: a.name,
      cpa: Math.round(a.cpa * 100) / 100,
      beating: isFinite(blended) && a.cpa < blended,
    }));

  const polData = list
    .filter((a) => a.policies > 0 || a.calls > 0)
    .sort((a, b) => b.policies - a.policies)
    .map((a) => ({ name: shortName(a.name), full: a.name, policies: a.policies }));

  const noSale = list.filter((a) => a.calls > 0 && a.policies === 0);

  const chartTooltip = ({ active, payload, label }) => {
    if (!active || !payload || !payload.length) return null;
    const p = payload[0];
    return (
      <div style={{
        background: C.ink, color: C.paper, padding: "8px 12px", borderRadius: 8,
        fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, lineHeight: 1.5,
        boxShadow: "0 4px 14px rgba(14,26,43,0.25)",
      }}>
        <div style={{ color: C.gold, fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase" }}>
          {p.payload.full || label}
        </div>
        <div>{p.dataKey === "cpa" ? fmt2.format(p.value) : `${fmtN.format(p.value)} policies`}</div>
      </div>
    );
  };

  /* ---------- styles ---------- */
  const card = {
    background: "#FFFFFF",
    border: `1px solid ${C.hair}`,
    borderRadius: 12,
    boxShadow: "0 1px 2px rgba(14,26,43,0.06)",
  };
  const label = {
    fontFamily: "'Inter', sans-serif",
    fontSize: 11,
    fontWeight: 600,
    letterSpacing: "0.1em",
    textTransform: "uppercase",
    color: C.muted,
  };
  const num = (size) => ({
    fontFamily: "'Space Grotesk', sans-serif",
    fontWeight: 700,
    fontSize: size,
    letterSpacing: "-0.03em",
    color: C.ink,
    lineHeight: 1.1,
  });
  const btn = (primary) => ({
    display: "inline-flex", alignItems: "center", gap: 8,
    padding: "9px 16px", borderRadius: 9, cursor: "pointer",
    fontFamily: "'Inter', sans-serif", fontSize: 13.5, fontWeight: 600,
    border: primary ? "1px solid transparent" : `1px solid rgba(247,245,239,0.35)`,
    background: primary ? C.gold : "transparent",
    color: primary ? C.ink : C.paper,
  });

  const sliceList = [...slices].sort((a, b) => b.start.localeCompare(a.start) || a.type.localeCompare(b.type));

  const kpis = [
    { label: "Call spend", value: hasData ? fmt0.format(totalSpend) : "—", color: C.ink },
    { label: "Inbound policies", value: hasData ? fmtN.format(totalPolicies) : "—", color: C.ink },
    { label: "Inbound calls", value: hasData ? fmtN.format(totalCalls) : "—", color: C.ink },
    {
      label: "ROI",
      value: hasData && blendedRoi !== null ? `${blendedRoi.toFixed(1)}%` : "—",
      color: blendedRoi === null ? C.ink : blendedRoi >= 0 ? C.green : C.red,
    },
  ];

  return (
    <div style={{ minHeight: "100vh", background: C.paper, color: C.ink, fontFamily: "'Inter', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        input[type="date"] { color-scheme: dark; }
        .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
        .kpi-grid { display: grid; grid-template-columns: 1.6fr repeat(4, 1fr); gap: 14px; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .cost-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .mast-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .upload-row { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
        @media (max-width: 900px) {
          .kpi-grid { grid-template-columns: 1fr 1fr; }
          .kpi-grid > .hero { grid-column: 1 / -1; }
          .charts-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 560px) {
          .kpi-grid { grid-template-columns: 1fr; }
        }

        /* --- animations --- */
        .reveal { opacity: 0; transform: translateY(20px); transition: opacity .65s ease, transform .65s cubic-bezier(.22,.68,.32,1); }
        .reveal.in { opacity: 1; transform: none; }
        .lift { transition: transform .22s ease, box-shadow .22s ease; }
        .lift:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(14,26,43,0.12); }
        .pressable { transition: transform .15s ease, filter .15s ease; }
        .pressable:hover { transform: translateY(-1px); filter: brightness(1.06); }
        .pressable:active { transform: translateY(0) scale(0.98); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
        .toast { animation: toastIn .35s ease; }
        @keyframes crownPop { 0% { transform: scale(0) rotate(-20deg); } 70% { transform: scale(1.25) rotate(6deg); } 100% { transform: scale(1) rotate(0); } }
        .crown { animation: crownPop .6s cubic-bezier(.2,.7,.3,1.4) both; display: inline-flex; }

        .lb-table { width: 100%; border-collapse: collapse; }
        .lb-table th { text-align: right; padding: 10px 14px; font-size: 11px; font-weight: 600;
          letter-spacing: 0.1em; text-transform: uppercase; color: ${C.muted};

                    </tbody>
                  </table>
                </div>
                {noSale.length > 0 && (
                  <div style={{
                    padding: "12px 20px 16px", fontSize: 12.5, color: C.muted,
                    borderTop: `1px solid ${C.hair}`, lineHeight: 1.5,
                  }}>
                    Calls but no inbound policies in this {view === "all" ? "view" : noun}:{" "}
                    {noSale.map((a) => a.name).join(", ")}. Their spend is included in the blended CPA.
                  </div>
                )}
              </div>
            </Reveal>

            <div style={{ marginTop: 14, fontSize: 11.5, color: C.muted, lineHeight: 1.5 }}>
              Inbound only — sales rows whose LEAD/CAMPAIGN contains “OUTBOUND” are excluded.
              Spend = Σ (calls per queue × rate). ROI = (commission − spend) ÷ spend.
              Sales dates come from each policy's Created timestamp; duplicate policies (same Contact Id)
              are counted once even across overlapping uploads.
            </div>
          </>
        )}
      </div>

      {/* ===== overwrite confirm modal ===== */}
      {pending && (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(14,26,43,0.55)", zIndex: 50,
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
        }}>
          <div style={{ ...card, maxWidth: 440, width: "100%", padding: "24px 24px 20px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <AlertTriangle size={18} color={C.gold} />
              <div style={{ ...num(17) }}>
                Replace {pending.type === "calls" ? "call" : "sales"} data for {fmtDate(pending.start)}
                {pending.start !== pending.end ? `–${fmtDate(pending.end)}` : ""}?
              </div>
            </div>
            <div style={{ fontSize: 13.5, color: C.muted, lineHeight: 1.55, marginBottom: 18 }}>
              A {pending.type === "calls" ? "call report" : "sales report"} covering this exact range is
              already loaded. Uploading will replace it — nothing is double-counted.
            </div>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button
                className="pressable"
                onClick={() => setPending(null)}
                style={{ ...btn(false), color: C.ink, border: `1px solid ${C.hair}` }}
              >
                Cancel
              </button>
              <button
                className="pressable"
                onClick={() => { commit(pending.start, pending.end, pending.type, pending.payload, pending.replaceId); setPending(null); }}
                style={{ ...btn(true), background: C.blue, color: "#fff" }}
              >
                Replace
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ===== cloud sync modal ===== */}
      {showCloud && (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(14,26,43,0.55)", zIndex: 50,
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
        }}>
          <div style={{ ...card, maxWidth: 460, width: "100%", padding: "24px 24px 20px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <Cloud size={18} color={C.blue} />
              <div style={{ ...num(17) }}>Shared cloud sync</div>
              <span style={{ flex: 1 }} />
              <button className="del-btn" onClick={() => setShowCloud(false)}><X size={16} /></button>
            </div>

            {!session ? (
              <>
                <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.55, marginBottom: 14 }}>
                  Connects this dashboard to your private Supabase project so you and your partner
                  see the same live data. One-time setup — see the guide in your project folder.
                </div>
                {[
                  ["Project URL", "url", "https://xxxx.supabase.co", "text"],
                  ["Anon (public) key", "anonKey", "eyJhbGciOi…", "text"],
                ].map(([lbl, k, ph, tp]) => (
                  <div key={k} style={{ marginBottom: 10 }}>
                    <div style={{ ...label, fontSize: 10, marginBottom: 4 }}>{lbl}</div>
                    <input
                      type={tp} value={cloudCfg[k]} placeholder={ph}
                      onChange={(e) => setCloudCfg((p) => ({ ...p, [k]: e.target.value }))}
                      style={{
                        width: "100%", border: `1px solid ${C.hair}`, borderRadius: 8, padding: "8px 10px",
                        fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, color: C.ink, background: "#fff",
                      }}
                    />
                  </div>
                ))}
                {[
                  ["Email", "email", "you@company.com", "email"],
                  ["Password", "password", "", "password"],
                ].map(([lbl, k, ph, tp]) => (
                  <div key={k} style={{ marginBottom: 10 }}>
                    <div style={{ ...label, fontSize: 10, marginBottom: 4 }}>{lbl}</div>
                    <input
                      type={tp} value={cloudForm[k]} placeholder={ph}
                      onChange={(e) => setCloudForm((p) => ({ ...p, [k]: e.target.value }))}
                      onKeyDown={(e) => { if (e.key === "Enter") signIn(); }}
                      style={{
                        width: "100%", border: `1px solid ${C.hair}`, borderRadius: 8, padding: "8px 10px",
                        fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, color: C.ink, background: "#fff",
                      }}
                    />
                  </div>
                ))}
                <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 16 }}>
                  <button
                    className="pressable"
                    onClick={() => setShowCloud(false)}
                    style={{ ...btn(false), color: C.ink, border: `1px solid ${C.hair}` }}
                  >
                    Cancel
                  </button>
                  <button
                    className="pressable" onClick={signIn}
                    style={{ ...btn(true), background: C.blue, color: "#fff" }}
                  >
                    Sign in & sync
                  </button>
                </div>
              </>
            ) : (
              <>
                <div style={{ fontSize: 13.5, color: C.muted, lineHeight: 1.6, marginBottom: 16 }}>
                  Signed in as <strong style={{ color: C.ink }}>{session.email}</strong>.<br />
                  Status: <strong style={{ color: syncStatus === "error" ? C.red : C.green }}>
                    {syncStatus === "syncing" ? "syncing…" : syncStatus === "error" ? "sync error" : "synced"}
                  </strong> — changes push automatically and your partner's changes appear within a minute.
                </div>
                <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                  <button
                    className="pressable" onClick={signOut}
                    style={{ ...btn(false), color: C.red, border: `1px solid ${C.hair}` }}
                  >
                    <LogOut size={14} /> Sign out
                  </button>
                  <button
                    className="pressable" onClick={syncNow}
                    style={{ ...btn(true), background: C.blue, color: "#fff" }}
                  >
                    <RefreshCw size={14} /> Sync now
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* ===== restore confirm modal ===== */}
      {pendingRestore && (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(14,26,43,0.55)", zIndex: 50,
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
        }}>
          <div style={{ ...card, maxWidth: 440, width: "100%", padding: "24px 24px 20px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <AlertTriangle size={18} color={C.gold} />
              <div style={{ ...num(17) }}>Replace the ledger with this backup?</div>
            </div>
            <div style={{ fontSize: 13.5, color: C.muted, lineHeight: 1.55, marginBottom: 18 }}>
              The backup ({pendingRestore.exported ? `saved ${fmtDate(pendingRestore.exported)}` : "unknown date"},{" "}
              {pendingRestore.slices.length} upload{pendingRestore.slices.length === 1 ? "" : "s"}) will replace
              the {slices.length} upload{slices.length === 1 ? "" : "s"} currently loaded. Consider downloading
              a backup of the current data first.
            </div>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button
                className="pressable"
                onClick={() => setPendingRestore(null)}
                style={{ ...btn(false), color: C.ink, border: `1px solid ${C.hair}` }}
              >
                Cancel
              </button>
              <button
                className="pressable"
                onClick={() => {
                  setSlices(pendingRestore.slices);
                  setQueueCost(pendingRestore.queueCost || {});
                  setPendingRestore(null);
                  setToast(`Backup restored — ${pendingRestore.slices.length} uploads back on the ledger.`);
                }}
                style={{ ...btn(true), background: C.blue, color: "#fff" }}
              >
                Restore
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ===== clear-all confirm modal ===== */}
      {confirmClear && (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(14,26,43,0.55)", zIndex: 50,
          display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
        }}>
          <div style={{ ...card, maxWidth: 420, width: "100%", padding: "24px 24px 20px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <Trash2 size={18} color={C.red} />
              <div style={{ ...num(17) }}>Clear the entire ledger?</div>
            </div>
            <div style={{ fontSize: 13.5, color: C.muted, lineHeight: 1.55, marginBottom: 18 }}>
              All {slices.length} upload{slices.length === 1 ? "" : "s"} and queue rates will be deleted permanently.
            </div>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button
                className="pressable"
                onClick={() => setConfirmClear(false)}
                style={{ ...btn(false), color: C.ink, border: `1px solid ${C.hair}` }}
              >
                Cancel
              </button>
              <button className="pressable" onClick={clearAll} style={{ ...btn(true), background: C.red, color: "#fff" }}>
                Clear all
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(CPALedger));
</script>
</body>
</html>
